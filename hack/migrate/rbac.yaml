---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compute-domain-daemon-service-account
  namespace: {oldNamespace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compute-domain-daemon-role
rules:
  - apiGroups: ["resource.nvidia.com"]
    resources: ["computedomains", "computedomains/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compute-domain-daemon-role-binding-{oldNamespace}
subjects:
  - kind: ServiceAccount
    name: compute-domain-daemon-service-account
    namespace: {oldNamespace}
roleRef:
  kind: ClusterRole
  name: compute-domain-daemon-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nvidia-dra-driver-gpu-role
  namespace: {oldNamespace}
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nvidia-dra-driver-gpu-role-binding
  namespace: {oldNamespace}
subjects:
  - kind: ServiceAccount
    name: {serviceAccountName}
    namespace: {newNamespace}
roleRef:
  kind: Role
  name: nvidia-dra-driver-gpu-role
  apiGroup: rbac.authorization.k8s.io
